<!-- @dsCard group="Colors" viewport="700x150" subtitle="Hairline separates, strong outlines, focus signals" name="Borders & lines" -->
<!doctype html>
<html lang="en" data-theme="dark">
<head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;padding:14px 16px;background:var(--surface-pane);font-family:var(--font-ui);font-size:var(--text-sm)}
.grid{display:flex;flex-wrap:wrap;gap:10px}
.sw{display:flex;flex-direction:column;gap:5px;min-width:88px}
.sw i{display:block;height:40px;border-radius:var(--radius-md);border:1px solid var(--border-hairline)}
.sw b{font-weight:var(--weight-medium);font-size:var(--text-xs);color:var(--text-secondary)}
.sw code{font-size:var(--text-2xs);color:var(--text-faint)}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:12px}
.k{font-family:var(--font-mono);font-size:var(--text-2xs);color:var(--text-faint)}

</style></head>
<body><div class="grid">
<div class="sw"><i style="background:var(--border-hairline);"></i><b>hairline</b><code>--border-hairline</code></div><div class="sw"><i style="background:var(--border-default);"></i><b>default</b><code>--border-default</code></div><div class="sw"><i style="background:var(--border-strong);"></i><b>strong</b><code>--border-strong</code></div><div class="sw"><i style="background:var(--border-focus);"></i><b>focus</b><code>--border-focus</code></div>
</div>
<p class="k" style="margin:12px 0 0">Panels are separated by 1px hairlines only. A second border on the same edge is always a bug.</p></body></html>
