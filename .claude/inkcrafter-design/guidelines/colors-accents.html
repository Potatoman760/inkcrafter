<!-- @dsCard group="Colors" viewport="700x160" subtitle="One lightness, one chroma, five hues in oklch" name="Accents" -->
<!doctype html>
<html lang="en" data-theme="dark">
<head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;padding:14px 16px;background:var(--surface-pane);font-family:var(--font-ui);font-size:var(--text-sm)}
.grid{display:flex;flex-wrap:wrap;gap:10px}
.sw{display:flex;flex-direction:column;gap:5px;min-width:88px}
.sw i{display:block;height:40px;border-radius:var(--radius-md);border:1px solid var(--border-hairline)}
.sw b{font-weight:var(--weight-medium);font-size:var(--text-xs);color:var(--text-secondary)}
.sw code{font-size:var(--text-2xs);color:var(--text-faint)}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:12px}
.k{font-family:var(--font-mono);font-size:var(--text-2xs);color:var(--text-faint)}

</style></head>
<body><div class="grid">
<div class="sw"><i style="background:var(--accent-signal);"></i><b>signal</b><code>--accent-signal</code></div><div class="sw"><i style="background:var(--accent-branch);"></i><b>branch</b><code>--accent-branch</code></div><div class="sw"><i style="background:var(--accent-good);"></i><b>good</b><code>--accent-good</code></div><div class="sw"><i style="background:var(--accent-caution);"></i><b>caution</b><code>--accent-caution</code></div><div class="sw"><i style="background:var(--accent-alert);"></i><b>alert</b><code>--accent-alert</code></div>
</div>
<p class="k" style="margin:12px 0 0">oklch(0.74 0.12 H). Hue is the only variable, so no accent can shout over another.</p></body></html>
