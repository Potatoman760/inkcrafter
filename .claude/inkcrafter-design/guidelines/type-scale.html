<!-- @dsCard group="Type" viewport="700x230" subtitle="Compact: 13px is the interface default" name="Scale" -->
<!doctype html>
<html lang="en" data-theme="dark">
<head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;padding:14px 16px;background:var(--surface-pane);font-family:var(--font-ui);font-size:var(--text-sm)}
.grid{display:flex;flex-wrap:wrap;gap:10px}
.sw{display:flex;flex-direction:column;gap:5px;min-width:88px}
.sw i{display:block;height:40px;border-radius:var(--radius-md);border:1px solid var(--border-hairline)}
.sw b{font-weight:var(--weight-medium);font-size:var(--text-xs);color:var(--text-secondary)}
.sw code{font-size:var(--text-2xs);color:var(--text-faint)}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:12px}
.k{font-family:var(--font-mono);font-size:var(--text-2xs);color:var(--text-faint)}

</style></head>
<body><div class="stack" style="gap:6px">
<div class="row"><span style="font-size:var(--text-display);color:var(--text-primary)">28 display</span><code class="k">--text-display</code></div>
<div class="row"><span style="font-size:var(--text-2xl);color:var(--text-primary)">22 dialog title</span><code class="k">--text-2xl</code></div>
<div class="row"><span style="font-size:var(--text-xl)">18 section</span><code class="k">--text-xl</code></div>
<div class="row"><span style="font-size:var(--text-lg)">15 emphasis</span><code class="k">--text-lg</code></div>
<div class="row"><span style="font-size:var(--text-md)">13 interface default</span><code class="k">--text-md</code></div>
<div class="row"><span style="font-size:var(--text-sm)">12 controls</span><code class="k">--text-sm</code></div>
<div class="row"><span style="font-size:var(--text-xs)">11 labels &amp; meta</span><code class="k">--text-xs</code></div>
<div class="row"><span style="font-size:var(--text-2xs)">10.5 badges only</span><code class="k">--text-2xs</code></div>
</div></body></html>
