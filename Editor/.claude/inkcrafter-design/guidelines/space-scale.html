<!-- @dsCard group="Spacing" viewport="700x150" subtitle="2px base — a compact IDE needs the half-step" name="Space scale" -->
<!doctype html>
<html lang="en" data-theme="dark">
<head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;padding:14px 16px;background:var(--surface-pane);font-family:var(--font-ui);font-size:var(--text-sm)}
.grid{display:flex;flex-wrap:wrap;gap:10px}
.sw{display:flex;flex-direction:column;gap:5px;min-width:88px}
.sw i{display:block;height:40px;border-radius:var(--radius-md);border:1px solid var(--border-hairline)}
.sw b{font-weight:var(--weight-medium);font-size:var(--text-xs);color:var(--text-secondary)}
.sw code{font-size:var(--text-2xs);color:var(--text-faint)}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:12px}
.k{font-family:var(--font-mono);font-size:var(--text-2xs);color:var(--text-faint)}

</style></head>
<body><div class="grid" style="align-items:flex-end">
<div class="sw" style="min-width:52px"><i style="height:var(--space-1);background:var(--accent-signal);border:0;border-radius:2px"></i><code>--space-1</code></div><div class="sw" style="min-width:52px"><i style="height:var(--space-2);background:var(--accent-signal);border:0;border-radius:2px"></i><code>--space-2</code></div><div class="sw" style="min-width:52px"><i style="height:var(--space-3);background:var(--accent-signal);border:0;border-radius:2px"></i><code>--space-3</code></div><div class="sw" style="min-width:52px"><i style="height:var(--space-4);background:var(--accent-signal);border:0;border-radius:2px"></i><code>--space-4</code></div><div class="sw" style="min-width:52px"><i style="height:var(--space-5);background:var(--accent-signal);border:0;border-radius:2px"></i><code>--space-5</code></div><div class="sw" style="min-width:52px"><i style="height:var(--space-6);background:var(--accent-signal);border:0;border-radius:2px"></i><code>--space-6</code></div><div class="sw" style="min-width:52px"><i style="height:var(--space-7);background:var(--accent-signal);border:0;border-radius:2px"></i><code>--space-7</code></div><div class="sw" style="min-width:52px"><i style="height:var(--space-8);background:var(--accent-signal);border:0;border-radius:2px"></i><code>--space-8</code></div><div class="sw" style="min-width:52px"><i style="height:var(--space-9);background:var(--accent-signal);border:0;border-radius:2px"></i><code>--space-9</code></div><div class="sw" style="min-width:52px"><i style="height:var(--space-10);background:var(--accent-signal);border:0;border-radius:2px"></i><code>--space-10</code></div>
</div></body></html>
