<!-- @dsCard group="Spacing" viewport="700x180" subtitle="A file list at production density" name="Density in use" -->
<!doctype html>
<html lang="en" data-theme="dark">
<head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;padding:14px 16px;background:var(--surface-pane);font-family:var(--font-ui);font-size:var(--text-sm)}
.grid{display:flex;flex-wrap:wrap;gap:10px}
.sw{display:flex;flex-direction:column;gap:5px;min-width:88px}
.sw i{display:block;height:40px;border-radius:var(--radius-md);border:1px solid var(--border-hairline)}
.sw b{font-weight:var(--weight-medium);font-size:var(--text-xs);color:var(--text-secondary)}
.sw code{font-size:var(--text-2xs);color:var(--text-faint)}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:12px}
.k{font-family:var(--font-mono);font-size:var(--text-2xs);color:var(--text-faint)}

</style></head>
<body><div style="width:260px;border:1px solid var(--border-hairline);border-radius:var(--radius-md);background:var(--surface-pane);padding:4px">
<div class="ic-group-label" style="padding:8px 12px 4px">ink</div>
<button class="ic-row"><span class="ic-row__body"><span class="ic-row__name ic-row__name--mono">chapter2.ink</span></span></button>
<button class="ic-row is-selected"><span class="ic-row__body"><span class="ic-row__name ic-row__name--mono">main.ink</span></span><span class="ic-row__trail"><span class="ic-badge ic-badge--accent">main</span></span></button>
<button class="ic-row ic-row--dirty"><span class="ic-row__body"><span class="ic-row__name ic-row__name--mono">state.ink</span><span class="ic-row__meta">generated</span></span></button>
</div></body></html>
