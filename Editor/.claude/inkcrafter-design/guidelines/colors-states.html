<!-- @dsCard group="Colors" viewport="700x160" subtitle="Foreground plus a 16% wash for each state" name="Semantic states" -->
<!doctype html>
<html lang="en" data-theme="dark">
<head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;padding:14px 16px;background:var(--surface-pane);font-family:var(--font-ui);font-size:var(--text-sm)}
.grid{display:flex;flex-wrap:wrap;gap:10px}
.sw{display:flex;flex-direction:column;gap:5px;min-width:88px}
.sw i{display:block;height:40px;border-radius:var(--radius-md);border:1px solid var(--border-hairline)}
.sw b{font-weight:var(--weight-medium);font-size:var(--text-xs);color:var(--text-secondary)}
.sw code{font-size:var(--text-2xs);color:var(--text-faint)}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:12px}
.k{font-family:var(--font-mono);font-size:var(--text-2xs);color:var(--text-faint)}

</style></head>
<body><div class="grid">
<div class="sw"><i style="background:var(--state-ok-bg);border-color:var(--state-ok)"></i><b style="color:var(--state-ok)">ok</b><code>--state-ok</code></div>
<div class="sw"><i style="background:var(--state-info-bg);border-color:var(--state-info)"></i><b style="color:var(--state-info)">info</b><code>--state-info</code></div>
<div class="sw"><i style="background:var(--state-warning-bg);border-color:var(--state-warning)"></i><b style="color:var(--state-warning)">warning</b><code>--state-warning</code></div>
<div class="sw"><i style="background:var(--state-error-bg);border-color:var(--state-error)"></i><b style="color:var(--state-error)">error</b><code>--state-error</code></div>
</div>
<div class="row" style="margin-top:12px">
<span class="ic-pill ic-pill--ok"><span class="ic-pill__dot"></span>Compiled in 32ms</span>
<span class="ic-pill ic-pill--error"><span class="ic-pill__dot"></span>2 errors</span>
<span class="ic-pill ic-pill--busy"><span class="ic-pill__dot"></span>Compiling…</span>
</div></body></html>
