<!-- @dsCard group="Brand" viewport="700x170" subtitle="Three shadows, all neutral black, never coloured" name="Elevation" -->
<!doctype html>
<html lang="en" data-theme="dark">
<head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;padding:14px 16px;background:var(--surface-pane);font-family:var(--font-ui);font-size:var(--text-sm)}
.grid{display:flex;flex-wrap:wrap;gap:10px}
.sw{display:flex;flex-direction:column;gap:5px;min-width:88px}
.sw i{display:block;height:40px;border-radius:var(--radius-md);border:1px solid var(--border-hairline)}
.sw b{font-weight:var(--weight-medium);font-size:var(--text-xs);color:var(--text-secondary)}
.sw code{font-size:var(--text-2xs);color:var(--text-faint)}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:12px}
.k{font-family:var(--font-mono);font-size:var(--text-2xs);color:var(--text-faint)}

</style></head>
<body><div class="grid" style="gap:16px">
<div class="sw" style="min-width:120px"><i style="height:52px;background:var(--surface-raised);box-shadow:var(--shadow-raised);border-radius:var(--radius-lg)"></i><b>raised</b><code>cards, rows</code></div>
<div class="sw" style="min-width:120px"><i style="height:52px;background:var(--surface-overlay);box-shadow:var(--shadow-pop);border-radius:var(--radius-lg)"></i><b>pop</b><code>menus, toasts</code></div>
<div class="sw" style="min-width:120px"><i style="height:52px;background:var(--surface-overlay);box-shadow:var(--shadow-dialog);border-radius:var(--radius-lg)"></i><b>dialog</b><code>modals</code></div>
</div></body></html>
